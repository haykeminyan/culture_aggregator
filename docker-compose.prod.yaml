services:
  culture_aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: production
    container_name: culture_aggregator
    expose:
      - "8002"  # доступно только внутри Docker-сети
    ports: [ ]  # убери это
    env_file:
      - .env
    environment:
      - PICCOLO_CONF=piccolo_conf
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - culture_aggregator_network
    command: uvicorn main_server:app --host 0.0.0.0 --port 8002 --reload

  postgres:
    image: postgres:17.5
    container_name: postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - culture_aggregator_network

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "8081:8081"     # HTTP
      - "8443:8443"     # HTTPS (QUIC работает!)
      - "8443:8443/udp" # UDP для HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - culture_aggregator_network

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    command: >
      certonly --webroot
      --webroot-path=/usr/share/nginx/html
      --email ibhayk@gmail.com
      --agree-tos
      --no-eff-email
      -d travelculturehub.com
      -d www.travelculturehub.com
      --non-interactive
      --keep-until-expiring
    networks:
      - culture_aggregator_network




networks:
  culture_aggregator_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config: