services:
  culture_aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: production
    container_name: culture_aggregator
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - culture_aggregator_network
    command: uvicorn main_server:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:17.5
    container_name: postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - culture_aggregator_network

  nginx:
    image: dasskelett/nginx-quic:latest
    container_name: nginx
    ports:
      - "81:80"
      - "444:443"
      - "444:443/udp"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - culture_aggregator
    networks:
      - culture_aggregator_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/usr/share/nginx/html
      --email ibhayk@gmail.com --agree-tos --no-eff-email
      -d yourdomain.com && echo 'Certificates obtained.'"
    networks:
      - culture_aggregator_network

networks:
  culture_aggregator_network:
    driver: bridge

volumes:
  postgres_data:
