services:
  culture_aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: production
    container_name: culture_aggregator
    expose:
      - "8002"  # доступно только внутри Docker-сети
    ports: [ ]  # убери это
    env_file:
      - .env
    environment:
      - PICCOLO_CONF=piccolo_conf
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - culture_aggregator_network
    command: uvicorn main_server:app --host 0.0.0.0 --port 8002 --reload

  postgres:
    image: postgres:17.5
    container_name: postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - culture_aggregator_network

  nginx:
    image: dasskelett/nginx-quic:latest
    container_name: nginx
    ports:
      - "8082:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/letsencrypt
      - ./ui/static:/app/ui/static
    depends_on:
      - culture_aggregator
    networks:
      - culture_aggregator_network

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    command: >
      certonly --webroot
      --webroot-path=/usr/share/nginx/html
      --email ibhayk@gmail.com
      --agree-tos
      --no-eff-email
      -d travelculturehub.com
      -d www.travelculturehub.com
      --non-interactive
      --keep-until-expiring
    networks:
      - culture_aggregator_network




networks:
  culture_aggregator_network:
    driver: bridge

volumes:
  postgres_data:
