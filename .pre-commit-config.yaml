repos:

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      # Automatically add trailing commas to calls and literals.
      - id: add-trailing-comma

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.3
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  # Black is a Python code formatter and ensures that our code is consistently formatted.
  - repo: https://github.com/ambv/black
    rev: 24.10.0
    hooks:
      - id: black
        additional_dependencies: ['click==8.0.4']
        args: [
          --skip-string-normalization, # black is opinionated towards "" strings by default, skip that check
          --line-length=99
        ]


  # Isort is a Python utility to sort imports accordingly to PEP-8
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [ "--settings-path=.isort.cfg" ]


  # Some out-of-the-box hooks for pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Simply check whether files parse as valid python.
      - id: check-ast


      # Checks for a common error of placing code before the docstring.
      - id: check-docstring-first


      # Check for debugger imports and py37+ breakpoint() calls in python source.
      - id: debug-statements


      # Prevent addition of new git submodules.
      - id: forbid-new-submodules


      # Replaces or checks mixed line ending.
      - id: mixed-line-ending


      # Trims trailing whitespace.
      - id: trailing-whitespace


      # Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer


      # # Assert that files in tests/ match test*.py.
      # - id: name-tests-test
      #   args: [--django]

      # Check for files with names that would conflict on a case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-case-conflict


      # Check for files that contain merge conflict strings.
      - id: check-merge-conflict


      # Checks for symlinks which do not point to anything.
      - id: check-symlinks


      # Replaces double quoted strings with single quoted strings.
      - id: double-quote-string-fixer


      # Remove # -*- coding: utf-8 -*- to the top of python files.
      - id: fix-encoding-pragma
        args: [--remove]


      # Ensures that links to vcs websites are permalinks.
      - id: check-vcs-permalinks


      # Attempts to load all json files to verify syntax.
      - id: check-json


      #  Protect specific branches from direct checkins.
      - id: no-commit-to-branch
        args: [
          -b dev,
          -b master
        ]


      # Checks that all your JSON files are "pretty".
      - id: pretty-format-json
        args: [
          --autofix,
          --no-sort-keys,
          --no-ensure-ascii
        ]


      # Attempts to load all yaml files to verify syntax.
      - id: check-yaml


      # Sorts simple YAML files which consist only of top-level keys, preserving comments and blocks.
      - id: sort-simple-yaml


  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      # Run flake8 on python files.
      - id: flake8
        args: [
          --max-line-length=99,
          --max-complexity=40,
          --ignore=** W503
          --ignore=**/__init__.py F401 F403
        ]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0 # You can change this to the latest version
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|css|scss|json)$  # Add file types you want to format
        args: ['--write']  # Automatically fix the code

  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: ''  # Use the sha / tag you want to point at
    hooks:
    -   id: pylint



  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: [ --remove-all-unused-imports, --in-place ]
