worker_processes auto;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    client_body_buffer_size 16k;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    ## Anti-Crawler Settings ##
    # Block bad user agents
#     map $http_user_agent $is_bad_bot {
#         default 0;
#         "~*curl|wget|python|scrapy|bot|crawl|spider" 1;
#     }

    # Limit requests from the same IP
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    error_page 403 /403.html;

    # --- SITE: travelculturehub.com + www ---
    server {
        listen 443 ssl http2;
        listen 443 quic reuseport;  # HTTP/3

        server_name travelculturehub.com www.travelculturehub.com;

        ssl_certificate /etc/letsencrypt/live/travelculturehub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/travelculturehub.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/travelculturehub.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        # HTTP/3 configs
        ssl_early_data on;
        add_header Alt-Svc 'h3=":443"';
        add_header QUIC-Status $quic;
        ssl_ciphers 'EECDH+AESGCM:DH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 5m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

#         # Anti-crawler: Block bad user agents
#         if ($is_bad_bot) {
#             return 403;
#         }


        # Anti-crawler: Rate limiting
        limit_req zone=one burst=20 nodelay;
location = /sitemap.xml {
access_log /var/log/nginx/sitemap_access.log;
    proxy_pass http://culture_aggregator:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Remove potentially blocking headers for Googlebot
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Vary;
    proxy_hide_header X-Content-Type-Options;

    # Explicitly add safe headers
    add_header X-Frame-Options "";
    add_header X-Content-Type-Options "";
    add_header Referrer-Policy "";
    add_header Cross-Origin-Opener-Policy "";
}

location = /robots.txt {
    try_files $uri @django_robots;
}

location @django_robots {
    access_log /var/log/nginx/robots_access.log;
    proxy_pass http://culture_aggregator:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Remove potentially blocking headers for bots
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Vary;
    proxy_hide_header X-Content-Type-Options;

    # Explicitly add safe headers
    add_header X-Frame-Options "";
    add_header X-Content-Type-Options "";
    add_header Referrer-Policy "";
    add_header Cross-Origin-Opener-Policy "";
}





        location / {
            proxy_pass http://culture_aggregator:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffer_size 4k;
            proxy_buffers 16 8k;
            proxy_busy_buffers_size 16k;
            proxy_temp_file_write_size 64k;
        }


        location /set-language/ {
            allow all;
            proxy_pass http://culture_aggregator:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/src/app/staticfiles/;
            expires max;
            add_header Cache-Control "public";
            error_page 404 =403;
        }

        location /media/ {
            alias /usr/src/app/images/;
            autoindex on;
            expires max;
            add_header Cache-Control "public, max-age=31536000";
            allow all;
            sendfile on;
            access_log /var/log/nginx/media_access.log;
            error_log /var/log/nginx/media_error.log warn;
        }

        location /i18n/ {
            alias /usr/src/app/i18n/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers *;
        }

        location = /favicon.ico {
            alias /usr/src/app/staticfiles/favicon.ico;
            expires 1M;
            add_header Cache-Control "public";
        }

        location /403.html {
            root /usr/src/app/staticfiles;
            internal;
        }
    }

