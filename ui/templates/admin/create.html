<!-- templates/admin/create.html -->

{% block content %}
<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-xl font-bold mb-4">Create New Exhibition</h1>

  <form
    hx-post="/admin/exhibitions/create/"
    hx-encoding="multipart/form-data"
    hx-target="#form-result"
    class="space-y-4"
    enctype="multipart/form-data"
    method="post"
  >
    <div>
      <label class="block mb-1 font-medium">Title</label>
      <input name="title" class="w-full border rounded px-3 py-2" required />
    </div>

    <div>
      <label class="block mb-1 font-medium">Slug</label>
      <input name="slug" class="w-full border rounded px-3 py-2" required />
    </div>

    <div>
      <label class="block mb-1 font-medium">Short Description</label>
      <textarea name="short_description" class="w-full border rounded px-3 py-2"></textarea>
    </div>

    <div>
      <label class="block mb-1 font-medium">Category</label>
      <input name="category" class="w-full border rounded px-3 py-2" required />
    </div>

    <div>
      <label class="block mb-1 font-medium">Images (multiple)</label>
      <input type="file" name="images" multiple accept="image/*" class="w-full" />
    </div>

    <div id="form-result"></div>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Create</button>
  </form>
</div>
{% endblock %}
